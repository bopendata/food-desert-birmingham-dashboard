        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);

        }

            layer.on({

                    } else {
                        layer.eachLayer(function(feature){

                        });
                    }

            });

                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

            updateLegendPanel();
        }

        function updateLegendPanel() {
            var legendDiv = document.getElementById('legend-panel');
            if (!legendDiv) {
                return;
            }
            var pieces = [];

            // Dynamic layer legend (only the currently selected one)
            if (currentDynamicLayerKey && layerLookup[currentDynamicLayerKey]) {
                var dynLayer = layerLookup[currentDynamicLayerKey];
                if (map.hasLayer(dynLayer) && layerLegendMap.has(dynLayer)) {
                    pieces.push(layerLegendMap.get(dynLayer));
                }
            }

            // Grocery store legend (if toggled on)
            var groceryLayer = layerLookup['grocery_locations'];
            if (groceryLayer && map.hasLayer(groceryLayer) && layerLegendMap.has(groceryLayer)) {
                pieces.push(layerLegendMap.get(groceryLayer));
            }

            legendDiv.innerHTML = pieces.join('<hr/>');
            legendDiv.style.display = pieces.length ? 'block' : 'none';
        }

		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  

            // --- Custom control wiring (dynamic groups and grocery toggle) ---
            // Dynamic group radios
            var dynamicGroupRadios = document.querySelectorAll('#control-panel input[name="dynamic-group"]');
            dynamicGroupRadios.forEach(function (radio) {
                radio.addEventListener('change', function () {
                    if (!radio.checked) {
                        return;
                    }
                    // Hide all sub-option blocks
                    var allSubs = document.querySelectorAll('#control-panel .sub-options');
                    allSubs.forEach(function (div) {
                        div.style.display = 'none';
                        // Clear any selected radio within this sub-group
                        var subRadios = div.querySelectorAll('input[type="radio"]');
                        subRadios.forEach(function (sr) {
                            sr.checked = false;
                        });
                    });
                    // Show the active sub-options block
                    var subId = 'sub-options-' + radio.value;
                    var activeSub = document.getElementById(subId);
                    if (activeSub) {
                        activeSub.style.display = 'block';
                        // Auto-select this group's default layer
                        var defaultRadio = activeSub.querySelector('input.dynamic-option[data-default="true"]');
                        if (defaultRadio) {
                            defaultRadio.checked = true;
                            var key = defaultRadio.getAttribute('data-layer-key');
                            setDynamicLayerByKey(key);
                        } else {
                            setDynamicLayerByKey(null);
                        }
                    } else {
                        setDynamicLayerByKey(null);
                    }
                });
            });

            // Dynamic layer radios inside each group
            var dynamicOptionRadios = document.querySelectorAll('#control-panel input.dynamic-option');
            dynamicOptionRadios.forEach(function (opt) {
                opt.addEventListener('change', function () {
                    if (!opt.checked) {
                        return;
                    }
                    var key = opt.getAttribute('data-layer-key');
                    setDynamicLayerByKey(key);
                });
            });

            // Grocery store on/off toggle
            var groceryToggle = document.getElementById('toggle-grocery');
            if (groceryToggle) {
                groceryToggle.checked = false; // start with grocery locations off
                groceryToggle.addEventListener('change', function () {
                    var lyr = layerLookup['grocery_locations'];
                    if (!lyr) {
                        return;
                    }
                    if (groceryToggle.checked) {
                        map.addLayer(lyr);
                    } else {
                        map.removeLayer(lyr);
                    }
                    updateLegendPanel();
                });
            }

            // Set initial default selection:
            // Residential Parcels group + its default (Food Desert / threshold)
            var initialGroup = document.querySelector('#control-panel input[name="dynamic-group"][value="residential"]');
            if (initialGroup) {
                initialGroup.checked = true;
                var resSub = document.getElementById('sub-options-residential');
                if (resSub) {
                    resSub.style.display = 'block';
                    var resDefault = resSub.querySelector('input.dynamic-option[data-default="true"]');
                    if (resDefault) {
                        resDefault.checked = true;
                        var initKey = resDefault.getAttribute('data-layer-key');
                        setDynamicLayerByKey(initKey);
                    }
                }
            }

            // Ensure legend reflects initial selection
            updateLegendPanel();
        });       
        setBounds();
        </script>        
    </body>
</html>
